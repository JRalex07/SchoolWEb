  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "School Website",
    "url": "https://school.alex.runs-on.dev",
    "logo": "https://school.alex.runs-on.dev/default-school-logo.svg",
    "description": "Official school website portal featuring academic excellence, leadership development, campus activities, school calendar, and community initiatives."
  }
  </script>

  <!-- GitHub Pages SPA routing restorer -->
  <script>
    (function () {
      var searchParams = new URLSearchParams(window.location.search);
      var p = searchParams.get('p');
      if (p) {
        var cleanPath = decodeURIComponent(p);
        var q = searchParams.get('q');
        var newUrl = cleanPath + (q ? '?' + decodeURIComponent(q) : '') + window.location.hash;
        window.history.replaceState(null, null, newUrl);
      }
    })();
  </script>
  <!-- Favicon Section -->
  <link rel="icon" type="image/svg+xml" href="/default-school-logo.svg" id="app-favicon" />
  <link rel="alternate icon" href="/default-school-logo.svg" />
  <!-- Fonts -->
