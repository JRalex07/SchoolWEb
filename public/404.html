<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Website Portal | Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="/default-school-logo.svg" />
  <script>
    // GitHub Pages SPA Single-Page Routing Redirector
    // Redirects route requests back to index.html with preserved query/path
    (function () {
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var fullPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var knownRoutes = ['about', 'admissions', 'academics', 'calendar', 'contact', 'faith'];
      var isKnown = knownRoutes.some(function(r) { return fullPath.indexOf(r) === 0; });
      if (isKnown) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/?p=/' + encodeURIComponent(fullPath) +
          (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
          l.hash
        );
      }
    })();
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F7F4EE;
      color: #211B52;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(33, 27, 82, 0.12);
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 2.25rem;
      margin: 0.5rem 0;
      color: #211B52;
    }
    p {
      color: #69687D;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      background: #F4A024;
      color: #16113A;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(244, 160, 36, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🦉</div>
    <h1>Page Not Found</h1>
    <p>Hoot! It looks like this page took a detour into the forest. Let's guide you back to our main campus portal.</p>
    <a href="/" class="btn">Return to Campus Home</a>
  </div>
</body>
</html>
